name: Sync official upstream

on:
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-official-upstream
  cancel-in-progress: false

jobs:
  sync:
    name: Update official-sync
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out official mirror branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: official-sync
          fetch-depth: 0
          persist-credentials: true

      - name: Fast-forward from the official repository
        env:
          UPSTREAM_REPOSITORY: QuantumNous/new-api
        run: |
          set -euo pipefail
          git remote add upstream "https://github.com/${UPSTREAM_REPOSITORY}.git"
          git fetch --no-tags upstream main
          git merge --ff-only upstream/main
          git push origin HEAD:official-sync

      - name: Report integration status
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin develop
          if git merge-base --is-ancestor official-sync origin/develop; then
            echo "develop already contains the latest official commits."
            exit 0
          fi

          compare_url="https://github.com/${REPOSITORY}/compare/develop...official-sync?expand=1"
          {
            echo "## Official updates are ready"
            echo
            echo "The mirror branch was updated. Review the official changes, then create the integration pull request manually so required pull-request CI runs."
            echo
            echo "[Create official-sync -> develop pull request](${compare_url})"
          } >> "${GITHUB_STEP_SUMMARY}"
