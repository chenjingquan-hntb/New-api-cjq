name: Sync official upstream

on:
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-official-upstream
  cancel-in-progress: false

jobs:
  sync:
    name: Update official-sync and open integration PR
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out official mirror branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: official-sync
          fetch-depth: 0
          persist-credentials: true

      - name: Fast-forward from the official repository
        env:
          UPSTREAM_REPOSITORY: QuantumNous/new-api
        run: |
          set -euo pipefail
          git remote add upstream "https://github.com/${UPSTREAM_REPOSITORY}.git"
          git fetch --no-tags upstream main
          git merge --ff-only upstream/main
          git push origin HEAD:official-sync

      - name: Open a pull request into develop when needed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin develop
          if git merge-base --is-ancestor official-sync origin/develop; then
            echo "develop already contains the latest official commits."
            exit 0
          fi

          existing_pr="$(gh pr list \
            --base develop \
            --head official-sync \
            --state open \
            --json number \
            --jq '.[0].number // empty')"

          if [ -n "${existing_pr}" ]; then
            echo "Integration PR #${existing_pr} is already open."
            exit 0
          fi

          gh pr create \
            --base develop \
            --head official-sync \
            --title "chore: sync official upstream" \
            --body $'## 变更描述 / Description\n\n将官方 `QuantumNous/new-api` 的最新提交集成到 `develop`。此 PR 必须经过 CI、冲突审查和预发布验证，不应自动合并。\n\n## 变更类型 / Type of change\n\n- [x] ⚡ 性能优化 / 重构 (Refactor)\n\n## 提交前检查项 / Checklist\n\n- [ ] 已审查官方变更和迁移说明\n- [ ] CI 已通过\n- [ ] 已在预发布环境完成核心流程回归\n- [ ] 已准备数据库备份与回滚方案\n\n## 运行证明 / Proof of Work\n\n请在合并前补充 CI 和预发布验证记录。'
